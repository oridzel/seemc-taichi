[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seemc-taichi"
version = "0.7.3"
description = "Experimental Taichi acceleration backend for SEEMC electron Monte Carlo transport"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "taichi>=1.7.4",
]

[project.optional-dependencies]
reference = ["seemc-imaging>=0.7.5"]
test = ["pytest>=8"]
animation = ["matplotlib>=3.8", "pillow>=10"]

[project.scripts]
seemc-taichi-info = "seemc_taichi.cli:main"
seemc-taichi-sweep = "seemc_taichi.sweep_cli:main"
seemc-reference-emissions = "seemc_taichi.reference_sweep_cli:main"
seemc-taichi-trapezoid = "seemc_taichi.trapezoid_scan_cli:main"
seemc-taichi-animate-trapezoid = "seemc_taichi.trajectory_anim_cli:main"
seemc-taichi-animate-scan = "seemc_taichi.scan_anim_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
